  ] },
  { "Run and maintain" = [
    { "Settings" = "Settings.md" },
    { "Health Checks" = "Health-Checks.md" },
    { "Performance" = "Performance.md" },
  ] },
  { "About" = [
    { "Contributing" = "Contributing.md" },
  ] },
]

[project.theme]
logo = "images/logo.svg"
favicon = "images/favicon.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "toc.follow",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bitr8/agregarr-dev"
name = "Agregarr (bitr8 fork) on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/bitr8/agregarr"
name = "bitr8/agregarr on Docker Hub"


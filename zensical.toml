[project]
site_name = "Agregarr Guide"
site_description = "User guide for Agregarr, the Plex collections and poster overlay manager."
site_url = "https://bitr8.github.io/agregarr-guide/"
docs_dir = "docs"
repo_url = "https://github.com/bitr8/agregarr-guide"
repo_name = "bitr8/agregarr-guide"
edit_uri = "edit/main/docs/"
copyright = "Docs licensed <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>. Spotted something wrong? <a href=\"https://bitr8.github.io/agregarr-guide/Contributing/\">Send a fix</a>."
extra_css = [
  "stylesheets/extra.css",
]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install with Docker Compose" = "get-started/install-docker.md" },
    { "First run: the setup wizard" = "get-started/setup-wizard.md" },
    { "Your first collection" = "get-started/first-collection.md" },
    { "How Agregarr works" = "get-started/how-it-works.md" },
    { "Finding your way around" = "get-started/finding-your-way.md" },
    { "Updating and image tags" = "get-started/updating.md" },
  ] },
  { "Collections" = [
    { "Collections" = "Collections.md" },
    { "Cycle Lists" = "Cycle-Lists.md" },
    { "TMDB Custom Advanced Filters" = "TMDB-Advanced-Filters.md" },
    { "Export and Import" = "Collection-Export-Import.md" },
  ] },
  { "Where collections appear" = [
    { "Rotation" = "Rotation.md" },
  ] },
  { "Missing items and placeholders" = [
    { "Placeholders" = "Placeholders.md" },
  ] },
  { "Overlays" = [
    { "Overlays" = "Overlays.md" },
    { "Overlay Conditions" = "Overlay-Conditions.md" },
    { "Overlay Variables" = "Overlay-Variables.md" },
    { "Overlay Examples" = "Overlay-Examples.md" },
    { "Color Scale" = "Color-Scale.md" },
    { "Episode Scanning" = "Episode-Scanning.md" },
    { "Maintainerr Countdown" = "Maintainerr-Countdown.md" },
  ] },
  { "Connect services" = [
    { "Integrations" = "Integrations.md" },
  ] },
  { "Run and maintain" = [
    { "Settings" = "Settings.md" },
    { "Health Checks" = "Health-Checks.md" },
    { "Performance" = "Performance.md" },
  ] },
  { "About" = [
    { "Contributing" = "Contributing.md" },
  ] },
]

[project.theme]
logo = "images/logo.svg"
favicon = "images/favicon.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "toc.follow",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bitr8/agregarr-dev"
name = "Agregarr (bitr8 fork) on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/bitr8/agregarr"
name = "bitr8/agregarr on Docker Hub"

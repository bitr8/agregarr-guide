    { "Your first overlay" = "get-started/first-overlay.md" },
    { "How Agregarr works" = "get-started/how-it-works.md" },
    { "Finding your way around" = "get-started/finding-your-way.md" },
    { "Updating and image tags" = "get-started/updating.md" },
  ] },
  { "Collections" = [
    { "Overview" = "collections/index.md" },
    { "Choose a source" = "collections/choose-a-source.md" },
    { "How-tos" = [
      { "Make a Trending or Popular collection" = "collections/make-trending.md" },
      { "Turn a list into a collection" = "collections/list-to-collection.md" },
      { "Streaming Top 10s and Originals" = "collections/streaming-top-10.md" },
      { "Collections from your own library" = "collections/from-your-library.md" },
      { "Anime collections" = "collections/anime.md" },
      { "Show what people request and watch" = "collections/requests-and-watching.md" },
      { "Rotate several lists through one row" = "collections/cycle-sources.md" },
      { "Run a collection only at certain times" = "collections/timed.md" },
      { "Keep items out of collections" = "collections/keep-items-out.md" },
      { "Adopt collections you already have" = "collections/adopt-existing.md" },
      { "Change many collections at once" = "collections/bulk-edit.md" },
      { "Move collections between servers" = "collections/move-between-servers.md" },
      { "Name collections" = "collections/name-collections.md" },
      { "Collection posters" = "collections/posters.md" },
    ] },
    { "Sources reference" = [
      { "TMDB" = "collections/sources/tmdb.md" },
      { "TMDB filter fields" = "collections/sources/tmdb-filters.md" },
      { "IMDb, Letterboxd, Trakt, MDBList, TVDB" = "collections/sources/lists.md" },
      { "AniList and MyAnimeList" = "collections/sources/anime.md" },
      { "Networks Top 10 and Originals" = "collections/sources/networks.md" },
      { "Your servers" = "collections/sources/your-servers.md" },
      { "Requests and watch stats" = "collections/sources/activity.md" },
      { "Coming Soon" = "collections/sources/coming-soon.md" },
      { "Multiple Sources" = "collections/sources/multiple-sources.md" },
    ] },
    { "Form reference" = [
      { "Source, library, titles and order" = "collections/form/basics.md" },
      { "Visibility and time restrictions" = "collections/form/visibility.md" },
      { "Posters, wallpapers and theme" = "collections/form/artwork.md" },
    ] },
    { "Collection pages" = "collections/pages.md" },
    { "Poster editor" = "collections/poster-editor.md" },
  ] },
  { "Where collections appear" = [
    { "Overview" = "appear/index.md" },
    { "Home, Recommended and Library" = "appear/home-recommended-library.md" },
    { "Order rows on Home" = "appear/order-home.md" },
    { "Shuffle Home order" = "appear/shuffle-home.md" },
    { "Promote collections on the Library tab" = "appear/promote-library.md" },
